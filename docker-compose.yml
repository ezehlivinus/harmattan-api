services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harmattan
      POSTGRES_PASSWORD: harmattan
      POSTGRES_DB: harmattan
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harmattan -d harmattan']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://harmattan:harmattan@db:5432/harmattan
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
